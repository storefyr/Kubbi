# VoxeLibre on Sailfish OS - default configuration for phones.
# Copied to ~/.local/share/luanti/minetest.conf on first start.
# Edit it there; changes here only affect new installations.
#
# Tuned conservatively for Mali-G610 (Jolla Phone 2026): the GPU has
# limited address space under libhybris, so we keep texture atlas,
# framebuffer and mesh memory low to avoid glGenTextures returning 0.

# --- rendering: GLES2 is the only GL stack on Sailfish (Wayland/libhybris) ---
video_driver = ogles2
fullscreen = true
vsync = false
fps_max = 30
fsaa = 0
antialiasing = none
mip_map = false
bilinear_filter = true
trilinear_filter = false
anisotropic_filter = false
enable_fog = false
enable_particles = false
enable_shaders = false
enable_post_processing = false
enable_bloom = false
enable_volumetric_lighting = false
enable_auto_exposure = false
enable_mesh_cache = false
smooth_lighting = false
shadow_levels = false
clouds = false
opaque_water = false
translucent_liquids = false
node_highlighting = none
enable_minimap = false
enable_damage = false

# --- texture / GPU memory ---
# Force textures to stay at their native 16x16 size (no upscaling),
# keeping the texture atlas as small as possible.
texture_min_size = 16
# Render the 3D world at half resolution (GUI stays full res).
# Halves framebuffer and render-target memory on the GPU.
undersampling = 2

# --- world / network limits (low to keep memory + mapblock count down) ---
viewing_range = 20
max_block_generate_distance = 2
max_block_send_distance = 3
client_mapblock_limit = 500
client_unload_unused_data_timeout = 60
active_block_range = 1
active_object_send_range_blocks = 1

# --- touch controls ---
touch_controls = true
touch_interaction_style = tap
touchscreen_sensitivity = 0.2
touchscreen_threshold = 20
touch_long_tap_delay = 400

# --- misc ---
enable_sound = true
sound_volume = 0.8
music_volume = 0.5
creative_mode = false
show_debug = false
pause_on_lost_focus = false
