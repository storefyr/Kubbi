# VoxeLibre on Sailfish OS - default configuration for phones.
# Copied to ~/.local/share/luanti/minetest.conf on first start.
# Edit it there; changes here only affect new installations.

# --- rendering: GLES2 is the only GL stack on Sailfish (Wayland/libhybris) ---
video_driver = ogles2
fullscreen = true
vsync = false
fps_max = 60
fsaa = 2
antialiasing = fsaa
mip_map = true
bilinear_filter = true
trilinear_filter = false
anisotropic_filter = false
enable_fog = true
enable_particles = true
enable_shaders = true
smooth_lighting = true
shadow_levels = false

# --- phone-friendly performance defaults (Dimensity 7100, 8/12 GB RAM) ---
viewing_range = 60
max_block_generate_distance = 5
max_block_send_distance = 8
enable_mesh_cache = true
free_move = false
cinematic = false
clouds = true
opaque_water = false
node_highlighting = box

# --- touch controls ---
touch_controls = true
touch_interaction_style = tap
touchscreen_sensitivity = 0.2
touchscreen_threshold = 20
touch_long_tap_delay = 400

# --- misc ---
enable_sound = true
sound_volume = 0.8
music_volume = 0.5
enable_damage = true
creative_mode = false
enable_minimap = true
show_debug = false
pause_on_lost_focus = false
